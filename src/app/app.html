<h2>Каталог фільмів</h2>

<div *ngFor="let movie of movies">
  <p><strong>{{ movie.title }}</strong></p>
  <p>Рік: {{ movie.year }}</p>
  <p>Рейтинг: {{ movie.rating }}</p>
  <button (click)="removeMovie(movie.id)">Видалити</button>
</div>

<hr>

<form #movieForm="ngForm" 
      (ngSubmit)="addMovie(title.value, +year.value, +rating.value); movieForm.reset()">
  <input type="text" #title placeholder="Назва" required>
  <input type="number" #year placeholder="Рік" required>
  <input type="number" #rating placeholder="Рейтинг" required>
  <button type="submit">Додати фільм</button>
</form>
