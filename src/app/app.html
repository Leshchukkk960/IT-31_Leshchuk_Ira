<div class="container">

  <h1>Каталог фільмів</h1>

  <p class="counter">
    Всього фільмів: {{ movies.length }}
  </p>

  <div class="form">

    <h2>Додати фільм</h2>

    <input
      type="text"
      placeholder="Назва фільму"
      [(ngModel)]="newTitle"
    >

    <input
      type="number"
      placeholder="Рік"
      [(ngModel)]="newYear"
    >

    <input
      type="number"
      min="1"
      max="10"
      placeholder="Рейтинг"
      [(ngModel)]="newRating"
    >

    <button
      (click)="addMovie()"
      [disabled]="newTitle.trim() === ''"
    >
      Додати фільм
    </button>

  </div>

  <div class="movies">

    <div
      class="movie"
      *ngFor="let movie of movies; let i = index"
      [ngClass]="{
        'high': movie.rating >= 8,
        'medium': movie.rating >= 5 && movie.rating < 8,
        'low': movie.rating < 5
      }"
    >

      <h2>{{ movie.title }}</h2>

      <p>Рік: {{ movie.year }}</p>

      <p>Рейтинг: {{ movie.rating }}/10</p>

      <p *ngIf="movie.rating >= 8" class="recommended">
        Рекомендовано
      </p>

      <button (click)="deleteMovie(i)">
        Видалити
      </button>

    </div>

  </div>

</div>
