<section>
  <h1>Список фільмів</h1>

  <a routerLink="/movies/add" class="button">
    + Додати фільм
  </a>

  <div class="movies">
    @for (movie of movies; track movie.id) {
      <article class="movie-card">
        <h2>{{ movie.title }}</h2>

        <p>
          <strong>Режисер:</strong> {{ movie.director }}
        </p>

        <p>
          {{ movie.description }}
        </p>

        <a [routerLink]="['/movie', movie.id]">
          Детальніше
        </a>
      </article>
    }
  </div>
</section>
